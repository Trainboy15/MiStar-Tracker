<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Minesweeper</title>
    <style>
        .minesweeper-container {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #bdbdbd;
            padding: 10px;
            border: 3px solid #fff;
            border-right-color: #7b7b7b;
            border-bottom-color: #7b7b7b;
            width: fit-content;
            user-select: none;
        }
        .minesweeper-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background-color: #bdbdbd;
            border: 3px solid #7b7b7b;
            border-right-color: #fff;
            border-bottom-color: #fff;
            padding: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .minesweeper-status {
            background-color: #000;
            color: #ff0000;
            font-family: monospace;
            font-size: 20px;
            padding: 2px 5px;
            font-weight: bold;
        }
        .minesweeper-btn {
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            background-color: #bdbdbd;
            border: 2px solid #fff;
            border-right-color: #7b7b7b;
            border-bottom-color: #7b7b7b;
        }
        .minesweeper-btn:active {
            border: 2px solid #7b7b7b;
            border-right-color: #fff;
            border-bottom-color: #fff;
        }
        .minesweeper-grid {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(10, 30px);
            border: 3px solid #7b7b7b;
            border-right-color: #fff;
            border-bottom-color: #fff;
        }
        .minesweeper-cell {
            width: 30px;
            height: 30px;
            background-color: #bdbdbd;
            border: 3px solid #fff;
            border-right-color: #7b7b7b;
            border-bottom-color: #7b7b7b;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .minesweeper-cell.revealed {
            background-color: #d9d9d9;
            border: 1px solid #7b7b7b;
        }
        .minesweeper-cell.mine {
            background-color: #ff3b30;
        }
        /* Number Colorings */
        .c-1 { color: blue; }
        .c-2 { color: green; }
        .c-3 { color: red; }
        .c-4 { color: darkblue; }
        .c-5 { color: maroon; }
    </style>
</head>
<body>

<div class="minesweeper-container">
    <div class="minesweeper-header">
        <div id="mine-count" class="minesweeper-status">010</div>
        <button id="reset-btn" class="minesweeper-btn">🙂</button>
        <div id="timer" class="minesweeper-status">000</div>
    </div>
    <div id="grid" class="minesweeper-grid"></div>
</div>

<script>
    const ROWS = 10;
    const COLS = 10;
    const MINES = 10;
    
    let grid = [];
    let gameOver = false;
    let minesLeft = MINES;
    let timerInterval = null;
    let timeElapsed = 0;
    let firstClick = true;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset-btn');

    function initGame() {
        gridEl.innerHTML = '';
        grid = [];
        gameOver = false;
        minesLeft = MINES;
        timeElapsed = 0;
        firstClick = true;
        clearInterval(timerInterval);
        
        mineCountEl.textContent = String(minesLeft).padStart(3, '0');
        timerEl.textContent = '000';
        resetBtn.textContent = '🙂';

        // Create empty board array
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                const cell = {
                    r, c,
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    neighborMines: 0,
                    element: document.createElement('div')
                };
                cell.element.classList.add('minesweeper-cell');
                
                // Left click to reveal
                cell.element.addEventListener('click', () => revealCell(cell));
                
                // Right click to flag
                cell.element.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    toggleFlag(cell);
                });

                gridEl.appendChild(cell.element);
                grid[r][c] = cell;
            }
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeElapsed = Math.min(timeElapsed + 1, 999);
            timerEl.textContent = String(timeElapsed).padStart(3, '0');
        }, 1000);
    }

    function generateMines(firstCell) {
        let placed = 0;
        while (placed < MINES) {
            let r = Math.floor(Math.random() * ROWS);
            let c = Math.floor(Math.random() * COLS);
            
            // Prevent mine on first click or duplicate placement
            if (!grid[r][c].isMine && (r !== firstCell.r || c !== firstCell.c)) {
                grid[r][c].isMine = true;
                placed++;
            }
        }

        // Calculate neighbor numbers
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!grid[r][c].isMine) {
                    grid[r][c].neighborMines = countNeighbors(r, c);
                }
            }
        }
    }

    function countNeighbors(row, col) {
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (grid[row + dr]?.[col + dc]?.isMine) count++;
            }
        }
        return count;
    }

    function revealCell(cell) {
        if (gameOver || cell.isRevealed || cell.isFlagged) return;

        if (firstClick) {
            firstClick = false;
            generateMines(cell);
            startTimer();
        }

        cell.isRevealed = true;
        cell.element.classList.add('revealed');

        if (cell.isMine) {
            endGame(false);
            return;
        }

        if (cell.neighborMines > 0) {
            cell.element.textContent = cell.neighborMines;
            cell.element.classList.add(`c-${cell.neighborMines}`);
        } else {
            // Flood fill for empty spaces
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const neighbor = grid[cell.r + dr]?.[cell.c + dc];
                    if (neighbor) revealCell(neighbor);
                }
            }
        }

        checkWin();
    }

    function toggleFlag(cell) {
        if (gameOver || cell.isRevealed) return;

        cell.isFlagged = !cell.isFlagged;
        cell.element.textContent = cell.isFlagged ? '🚩' : '';
        minesLeft += cell.isFlagged ? -1 : 1;
        mineCountEl.textContent = String(Math.max(0, minesLeft)).padStart(3, '0');
    }

    function checkWin() {
        let win = true;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!grid[r][c].isMine && !grid[r][c].isRevealed) win = false;
            }
        }
        if (win) endGame(true);
    }

    function endGame(isWin) {
        gameOver = true;
        clearInterval(timerInterval);
        resetBtn.textContent = isWin ? '😎' : '😵';

        // Reveal all mines
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c].isMine) {
                    grid[r][c].element.classList.add('mine');
                    grid[r][c].element.textContent = '💣';
                }
            }
        }
    }

    resetBtn.addEventListener('click', initGame);
    initGame();
</script>

</body>
</html>
