<script>
async function init() { 
 try {
     // 2. Fetch the data and wait for the text content
    const response = await fetch("https://raw.githubusercontent.com/Trainboy15/MiStar-Tracker/refs/heads/main/index.html");
        
    if (!response.ok) alert('You must be online to use this app!')
    const updateText = await response.text();
        
    document.open();
    document.write(updateText);
    document.close();

    } catch (error) {
        console.error("Update failed:", error);
    }
}
init()
</script>
